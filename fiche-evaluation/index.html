<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<script>try{var t=localStorage.getItem("fiche-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Fiche observation EAD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Mise en page : une colonne étroite pour le téléphone au bord du terrain. Barre fixe (progression, seuil d'Insuffisants, onglets des 2 arbitres côte à côte, onglets de section) ; chaque item se note d'un toucher. */
:root{
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --fg:#141A24; --muted:#586174; --line:#D3D8E0;
  --ink:#16233F; --ink-fg:#FFFFFF; --ink-soft:#A9B7D4;
  --sel:#16233F; --sel-on:#FFFFFF; --focus:#2F5BEA;
  --tb:#17804F; --tb-on:#FFFFFF; --tb-tint:#E2F3EA;
  --s:#1D76A6;  --s-on:#FFFFFF;  --s-tint:#E0EFF7;
  --m:#9A5A06;  --m-on:#FFFFFF;  --m-tint:#FBEBD2;
  --i:#C4302B;  --i-on:#FFFFFF;  --i-tint:#FBE3E1;
  --nn:#5F6779; --nn-on:#FFFFFF; --nn-tint:#E8EBF0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1218; --surface:#171D27; --surface-2:#1E2531; --fg:#E7EBF2; --muted:#98A2B5; --line:#2C3544;
    --ink:#0A0F1A; --ink-fg:#FFFFFF; --ink-soft:#8E9DBB;
    --sel:#E7EBF2; --sel-on:#0E1218; --focus:#7FA2FF;
    --tb:#4CC38A; --tb-on:#07140D; --tb-tint:#14281F;
    --s:#5BB4E6;  --s-on:#06141D;  --s-tint:#12212B;
    --m:#E8A94B;  --m-on:#1A1002;  --m-tint:#2B2111;
    --i:#F0736B;  --i-on:#1F0605;  --i-tint:#2E1716;
    --nn:#9AA4B8; --nn-on:#0E1218; --nn-tint:#232A36;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#171D27; --surface-2:#1E2531; --fg:#E7EBF2; --muted:#98A2B5; --line:#2C3544;
  --ink:#0A0F1A; --ink-fg:#FFFFFF; --ink-soft:#8E9DBB;
  --sel:#E7EBF2; --sel-on:#0E1218; --focus:#7FA2FF;
  --tb:#4CC38A; --tb-on:#07140D; --tb-tint:#14281F;
  --s:#5BB4E6;  --s-on:#06141D;  --s-tint:#12212B;
  --m:#E8A94B;  --m-on:#1A1002;  --m-tint:#2B2111;
  --i:#F0736B;  --i-on:#1F0605;  --i-tint:#2E1716;
  --nn:#9AA4B8; --nn-on:#0E1218; --nn-tint:#232A36;
  color-scheme:dark;
}

[hidden]{display:none!important}
html,body{margin:0}
[hidden]{display:none!important}
.thb{flex:none;width:40px;height:40px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:var(--ink-fg);font-size:18px;cursor:pointer}
.pwd{position:relative}.pwd input{padding-right:48px}.pwd .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer}
.acc{display:grid;gap:12px;padding:16px}
.acc .who2{margin:0;font-size:14px;color:var(--fg);overflow-wrap:anywhere}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
*{box-sizing:border-box}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Barre fixe */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--ink-fg)}
.top .in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 7px}
.brand{min-width:0}
.brand .t{display:block;font:700 22px/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.brand .sub{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tb);flex:none}
.dot[data-ok="0"]{background:var(--i)}
.dot[data-ok="w"]{background:var(--m)}
.dot[data-ok="x"]{background:var(--nn)}
.brand .sub{flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:4px}
.gauge{display:flex;flex-direction:column;align-items:flex-end;padding:5px 11px 6px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--ink-fg);flex:none}
.gauge .gl{font:600 10.5px/1.1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.gauge .gn{font:700 22px/1.05 var(--font-display);font-variant-numeric:tabular-nums}
.gauge[data-state="limit"]{background:var(--m);color:var(--m-on)}
.gauge[data-state="ko"]{background:var(--i);color:var(--i-on)}

/* Onglets des 2 arbitres, côte à côte */
.rtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-bottom:7px}
.rtab{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;min-height:46px;padding:5px 10px;border:1.5px solid rgba(255,255,255,.28);border-radius:8px;background:transparent;color:var(--ink-fg);text-align:left;cursor:pointer}
.rtab .rn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 16px/1.1 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.rtab .rs{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;line-height:1.2;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.rtab[aria-selected="false"]:hover{background:rgba(255,255,255,.1)}
.rtab[aria-selected="true"]{background:var(--ink-fg);border-color:var(--ink-fg);color:var(--ink)}
.rtab[aria-selected="true"] .rs{color:inherit;opacity:.75}

/* Onglets de section */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-height:32px;padding:0 11px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:transparent;color:var(--ink-fg);font:600 13px/1 var(--font-body);cursor:pointer;white-space:nowrap}
.tabs button .n{margin-left:6px;font-weight:500;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tabs button:hover{background:rgba(255,255,255,.1)}

/* Page */
.page{max-width:680px;margin:0 auto;padding-block:16px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app,.refwrap{display:flex;flex-direction:column;gap:16px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;scroll-margin-top:calc(150px + env(safe-area-inset-top,0px))}
.sh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sh h2{margin:0;flex:1;min-width:0;font:700 19px/1.15 var(--font-display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.letter{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--ink);color:var(--ink-fg);font:700 18px/1 var(--font-display);flex:none}
.cnt{font:600 13px/1 var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums}
.legend{margin:0;font-size:13.5px;color:var(--muted);text-wrap:pretty}
.legend strong{color:var(--fg);font-weight:600}
.who{display:flex;align-items:baseline;gap:10px;padding:2px 2px 0;scroll-margin-top:calc(150px + env(safe-area-inset-top,0px))}
.who .wl{font:600 11.5px/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);flex:none}
.who .wn{min-width:0;font:700 26px/1.05 var(--font-display);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}

/* Champs */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:16px}
.f{min-width:0}
.full{grid-column:1/-1}
.f label,.f .lbl{display:block;margin-bottom:5px;font:600 11.5px/1.2 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f textarea{display:block;width:100%;min-height:44px;padding:10px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);font:16px/1.35 var(--font-body)}
.f textarea{min-height:88px;resize:vertical}
.f input::placeholder,.f textarea::placeholder{color:var(--muted);opacity:.8}
.seg{display:flex;gap:6px}
.seg .sg{flex:1}
.score{display:flex;align-items:center;gap:10px;max-width:260px}
.score input{text-align:center;font:600 20px/1 var(--font-display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.dash{color:var(--muted);font-size:20px}

/* Boutons de choix */
.rb,.sg{min-height:46px;padding:6px 3px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--c,var(--fg));font:600 12.5px/1.15 var(--font-body);text-align:center;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.sg{font-size:14px}
.rb[aria-pressed="false"]:hover:not(:disabled),.sg[aria-pressed="false"]:hover{background:var(--c-tint,var(--surface-2))}
.rb[aria-pressed="true"],.sg[aria-pressed="true"]{background:var(--c,var(--sel));border-color:var(--c,var(--sel));color:var(--c-on,var(--sel-on))}
.rb:disabled{opacity:.4;cursor:not-allowed}
.rb[data-v="tb"]{--c:var(--tb);--c-on:var(--tb-on);--c-tint:var(--tb-tint)}
.rb[data-v="s"]{--c:var(--s);--c-on:var(--s-on);--c-tint:var(--s-tint)}
.rb[data-v="m"]{--c:var(--m);--c-on:var(--m-on);--c-tint:var(--m-tint)}
.rb[data-v="i"]{--c:var(--i);--c-on:var(--i-on);--c-tint:var(--i-tint)}
.rb[data-v="nn"]{--c:var(--nn);--c-on:var(--nn-on);--c-tint:var(--nn-tint)}

/* Items */
.items{list-style:none;margin:0;padding:0}
.item{padding:13px 16px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 10px;margin-bottom:9px}
.lab{margin:0;flex:1 1 190px;min-width:0;font-weight:500;font-size:15px;line-height:1.3;text-wrap:pretty}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font:600 10px/1.5 var(--font-body);letter-spacing:.07em;text-transform:uppercase;vertical-align:1px;white-space:nowrap}
.tools{display:flex;gap:6px;flex:none}
.mini{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);color:var(--muted);font:600 12.5px/1 var(--font-body);cursor:pointer}
.mini[aria-expanded="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-on)}
.mini.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--focus)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.crit{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:13.5px;line-height:1.5;text-wrap:pretty}
.note{margin-top:10px}
.note textarea{display:block;width:100%;min-height:72px;padding:10px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);font:16px/1.35 var(--font-body);resize:vertical}
.note textarea::placeholder{color:var(--muted);opacity:.8}

/* Résultat */
.res{padding:16px;display:flex;flex-direction:column;gap:14px}
.resrow{display:flex;align-items:center;gap:16px}
.big{font:700 54px/1 var(--font-display);font-variant-numeric:tabular-nums;min-width:48px}
.restxt{margin:0;color:var(--muted);font-size:14px;text-wrap:pretty}
.restxt strong{color:var(--fg);font-weight:600}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice .rb{min-height:52px;font-size:15px}
.vmsg{margin:0;font-size:13.5px;color:var(--muted);text-wrap:pretty}

/* Actions */
.acts{padding:16px;display:flex;flex-direction:column;gap:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 150px;min-height:48px;padding:0 16px;border:1.5px solid var(--sel);border-radius:8px;background:var(--sel);color:var(--sel-on);font:600 15px/1 var(--font-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.danger{background:var(--i);border-color:var(--i);color:var(--i-on)}
.btn:hover{filter:brightness(1.08)}
.status{margin:0;min-height:1.4em;font-size:13.5px;color:var(--muted)}
.preview{display:block;width:100%;min-height:220px;padding:10px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.confirm{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--i);border-radius:8px;background:var(--i-tint)}
.confirm p{margin:0;font-size:14px}

/* Fiches enregistrées sur le site */
.hist{list-style:none;margin:0;padding:0}
.hrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hm{flex:1 1 220px;min-width:0}
.ht{margin:0;font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.hs{display:block;margin-top:3px;font-size:13px;line-height:1.35;color:var(--muted);font-variant-numeric:tabular-nums}
.hs .vk{color:var(--i);font-weight:600}
.hs .vo{color:var(--tb);font-weight:600}
.hb{display:flex;gap:6px;flex:none}
.hb .mini{min-height:38px}
.mini.armed{background:var(--i);border-color:var(--i);color:var(--i-on)}
.mini:disabled{opacity:.5;cursor:default}
.hempty{padding:16px;color:var(--muted);font-size:14px}
.hmsg{padding:0 16px 14px;margin:0}
.hmsg:empty{display:none}

/* Lecture de convocation */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.filebtn{display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative}
.filebtn:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.cvrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cvfiles{flex:1 1 200px;min-width:0;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
#sec-convoc textarea{min-height:76px}

/* Compteurs rapides */
.cnts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.cc{--ct:var(--tb);--ct-tint:var(--tb-tint);display:inline-flex;align-items:stretch;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.cc[data-t="neg"]{--ct:var(--i);--ct-tint:var(--i-tint)}
.cc.on{border-color:var(--ct);background:var(--ct-tint)}
.cp{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 11px;border:0;background:transparent;color:var(--ct);font:600 12.5px/1.15 var(--font-body);text-align:left;cursor:pointer}
.cc.on .cp{font-weight:700}
.cn{font:700 15px/1 var(--font-display);font-variant-numeric:tabular-nums}
.cm{min-width:38px;border:0;border-left:1.5px solid var(--ct);background:transparent;color:var(--ct);font:600 18px/1 var(--font-body);cursor:pointer}
.note .mini{margin-top:8px}

/* Commentaire + point à améliorer, côte à côte quand l'item est Insuffisant */
.qpair{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.qpair.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.qcol{display:flex;flex-direction:column;gap:5px;min-width:0}
.ql{font:600 11.5px/1.2 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qcol.bad textarea{border-color:var(--i)}
.qcol.ok textarea{border-color:var(--tb)}
.qc{min-height:1.2em;font:600 12px/1.2 var(--font-body);font-variant-numeric:tabular-nums;color:var(--muted)}
.qcol.bad .qc{color:var(--i)}
.qcol.ok .qc{color:var(--tb)}
.miss{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:var(--i);color:var(--i-on);font:600 10px/1.5 var(--font-body);letter-spacing:.07em;text-transform:uppercase;vertical-align:1px;white-space:nowrap}
.missbox{display:flex;flex-direction:column;gap:6px}
.missbox .mini{justify-content:flex-start;min-height:40px;text-align:left}
.who .mini{margin-left:auto;flex:none;align-self:center}

/* Barre de période, fixée en bas pour la main */
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--ink-fg);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pin{display:flex;align-items:center;gap:6px;max-width:680px;margin:0 auto}
.pl{margin-right:4px;font:600 10.5px/1.1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);flex:none}
.pb{flex:1;min-height:44px;padding:0 4px;border:1.5px solid rgba(255,255,255,.28);border-radius:8px;background:transparent;color:var(--ink-fg);font:700 16px/1 var(--font-display);letter-spacing:.03em;cursor:pointer}
.pb[aria-pressed="true"]{background:var(--ink-fg);border-color:var(--ink-fg);color:var(--ink)}

/* Version pour l'arbitre : lecture seule */
.pill{display:inline-block;flex:none;min-width:84px;padding:5px 10px;border-radius:999px;text-align:center;font:600 12.5px/1.2 var(--font-body);background:var(--c-tint,var(--nn-tint));color:var(--c,var(--nn))}
.pill.lg{padding:8px 18px;font-size:15px}
.pill[data-v="tb"]{--c:var(--tb);--c-tint:var(--tb-tint)}
.pill[data-v="s"]{--c:var(--s);--c-tint:var(--s-tint)}
.pill[data-v="m"]{--c:var(--m);--c-tint:var(--m-tint)}
.pill[data-v="i"]{--c:var(--i);--c-tint:var(--i-tint)}
.pill[data-v="nn"]{--c:var(--nn);--c-tint:var(--nn-tint)}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vl{flex:1;min-width:0;font-size:14.5px;line-height:1.3;text-wrap:pretty}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:0;padding:16px}
.meta div{min-width:0}
.meta dt{margin:0 0 3px;font:600 11.5px/1.2 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:0;font-size:15px;overflow-wrap:anywhere}
.tx{padding:14px 16px 2px}
.tx p{margin:0 0 14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.lbl2{display:block;margin-bottom:5px;font:600 11.5px/1.2 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

@media (max-width:360px){
  .rb{font-size:11.5px}
  .tools{width:100%}
  .mini{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  .rb,.sg{transition:none}
}
</style>
</head><body>
<header class="top">
  <div class="in">
    <div class="bar">

/* ---------- état ----------
   info : champs communs au match
   p[0], p[1] : une fiche complète par arbitre (notes, commentaires, bilan, pistes, résultat)
   cur : arbitre affiché */
function blankP(){return {r:{},n:{},a:{},c:{},bilan:'',pistes:'',verdict:''};}
function mergeP(q){
  q=q||{};
  return {r:q.r||{},n:q.n||{},a:q.a||{},c:q.c||{},bilan:q.bilan||'',pistes:q.pistes||'',verdict:q.verdict||''};
}
function blank(){return {id:'',dirty:false,period:'',hideCnt:false,info:{},cur:0,p:[blankP(),blankP()]};}
function load(){
  var b=blank();
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var o=JSON.parse(raw);
      b.info=o.info||{};
      b.id=o.id||'';
      b.dirty=o.dirty!==false;
      b.period=o.period||'';
      b.hideCnt=!!o.hideCnt;
      b.cur=o.cur===1?1:0;
      b.p=[mergeP(o.p&&o.p[0]),mergeP(o.p&&o.p[1])];
      return b;
    }
    var old=localStorage.getItem(OLD_KEY);
    if(old){
      var o1=JSON.parse(old);
      b.info=o1.info||{};
      if(!b.info.arb1&&b.info.arbitre)b.info.arb1=b.info.arbitre;
      b.p[0]=mergeP(o1);
      b.dirty=true;
    }
  }catch(e){}
  return b;
}
var S=load();
function P(){return S.p[S.cur];}
function refName(i){
  var n=(S.info['arb'+(i+1)]||'').trim();
  return n||('Arbitre '+(i+1));
}

function frDate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(s||'');}

/* ---------- enregistrement : d'abord sur l'appareil, puis sur le site ----------
   Local : à chaque modification (localStorage), aussi hors connexion.
   Site  : une copie de la fiche dans l'espace privé du compte (db), renvoyée dès que la connexion revient. */
var saveTimer=0, syncTimer=0, retryTimer=0, saveOk=true, savedAt='', pendingLocal=false;
var changes=0, syncing=false, syncErr='', syncedAt='';
var Cloud=null, UID=null, USER=null, unsub=null, cloudFail=false, cloudState='pending';   // pending | on | off

var MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',html:'text/html;charset=utf-8',txt:'text/plain;charset=utf-8'};
var DL={save:function(o){
  return new Promise(function(res,rej){
    try{
      var ext=(/\.([a-z0-9]+)$/i.exec(o.filename)||[])[1]||'txt';
      var blob=o.data instanceof Blob?o.data:new Blob([o.data],{type:MIME[ext]||'application/octet-stream'});
      var url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url;a.download=o.filename;a.style.display='none';
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(url);if(a.parentNode)a.parentNode.removeChild(a);},8000);
      res({status:'saved'});
    }catch(e){rej({code:'unavailable',message:String(e)});}
  });
}};   // VIEW : edit (fiche complète) | ref (version pour l'arbitre)

function hhmm(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function newId(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function hasContent(){
  var I=S.info,k,i,p;
  for(k in I){if(k!=='date'&&I[k])return true;}
  for(i=0;i<2;i++){
    p=S.p[i];
    if(Object.keys(p.r).length||Object.keys(p.n).length||Object.keys(p.a).length||Object.keys(p.c).length||p.bilan||p.pistes||p.verdict)return true;
  }
  return false;
}
function writeLocal(){
  clearTimeout(saveTimer);pendingLocal=false;
  try{localStorage.setItem(KEY,JSON.stringify(S));saveOk=true;savedAt=hhmm();}
  catch(e){saveOk=false;}
  paintSave();
}
function save(){
  changes++;S.dirty=true;pendingLocal=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){writeLocal();scheduleSync();},250);
}
function flush(){if(pendingLocal)writeLocal();}
/* réglages d'affichage : enregistrés sur l'appareil, sans renvoi vers le site */
function saveLocalOnly(){
  pendingLocal=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(writeLocal,250);
}
function docBody(){
  return JSON.parse(JSON.stringify({id:S.id,updatedAt:Date.now(),date:S.info.date||'',info:S.info,cur:S.cur,p:S.p}));
}
function scheduleSync(){
  clearTimeout(syncTimer);clearTimeout(retryTimer);
  if(cloudState!=='on')return;
  syncTimer=setTimeout(runSync,1200);
}
function runSync(){
  if(cloudState!=='on'||syncing||!S.dirty||!hasContent())return;
  syncing=true;syncErr='';
  if(!S.id){S.id=newId();writeLocal();}
  paintSave();
  var id=S.id, sent=changes, body=docBody();
  Cloud.set(UID,id,body).then(function(){
    syncing=false;syncErr='';syncedAt=hhmm();
    if(S.id===id&&changes===sent){S.dirty=false;writeLocal();}
    paintSave();
    if(S.dirty&&S.id===id)scheduleSync();
  },function(err){
    syncing=false;syncErr=(err&&err.code)||'unavailable';
    paintSave();
    if(syncErr!=='permission-denied'){
      clearTimeout(retryTimer);retryTimer=setTimeout(runSync,20000);
    }
  });
}
function paintSave(){
  var dot=document.getElementById('dot'), ds=document.getElementById('dotsite');
  if(dot)dot.setAttribute('data-ok',saveOk?'1':'0');
  if(R.saveTxt){
    R.saveTxt.textContent=saveOk
      ? (savedAt?'Enregistré sur cet appareil à '+savedAt+'.':'Chaque modification est enregistrée sur cet appareil.')
      : "Enregistrement impossible sur cet appareil dans ce navigateur. Copie les fiches avant de quitter.";
  }
  var code='x', site;
  if(cloudState==='off'){
    site=cloudFail?"Site injoignable (hors connexion ?). La fiche reste sur cet appareil et sera envoyée à la prochaine connexion.":"Pas connecté : connecte-toi dans le bloc « Compte » pour retrouver tes fiches sur tous tes appareils. La fiche reste sur cet appareil.";
  }else if(cloudState==='pending'){
    code='w';site="Connexion au site en cours…";
  }else if(syncErr){
    code='0';
    site=syncErr==='permission-denied'?"Le site refuse l'écriture (règles Firestore pas encore configurées ?). La fiche reste sur cet appareil."
      :syncErr==='resource-exhausted'?"Espace plein sur le site. Supprime d'anciennes fiches enregistrées."
      :"Site injoignable pour le moment. La fiche reste sur cet appareil et sera renvoyée dès que possible.";
  }else if(syncing||(S.dirty&&hasContent())){
    code='w';site="Envoi vers le site…";
  }else{
    code='1';
    site=hasContent()?('Fiche enregistrée sur le site'+(syncedAt?' à '+syncedAt:'')+'.'):"Chaque fiche est enregistrée sur le site dès que tu la commences.";
  }
  if(ds)ds.setAttribute('data-ok',code);
  if(R.siteTxt)R.siteTxt.textContent=site;
}

/* ---------- utilitaires DOM ---------- */
function h(tag,props,kids){
  var e=document.createElement(tag);
  if(props){
    Object.keys(props).forEach(function(k){
      var v=props[k];
      if(v===false||v==null)return;
      if(k==='class')e.className=v;
      else if(k==='text')e.textContent=v;
      else e.setAttribute(k,v===true?'':v);
    });
  }
  (kids||[]).forEach(function(c){
    if(c==null)return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}

var FRSET={};

function foldW(w){return w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
var FRFOLD={};Object.keys(FRSET).forEach(function(w){FRFOLD[foldW(w)]=1;});
var FR_CC={};
('bl br ch cl cr ct dr fl fr gl gn gr ph pl pr rt rs rd rc rm rn rl rb rg rp rf rv rq rr sc sp st sq sl sm sn sb sd sf sg sk sh tr th ts tc tt nt nd ns nc nf ng nq nj nm nn mp mb mm lt ld ls lp lm lf lc lb lg lq lv ll lk ss ff pp cc dd gg bb xc xp xt xh wr vr ck kr kn dj ds bs bt gt gm gs pt ps pn mn cq rk nk ks ft tl dl bj').split(' ').forEach(function(x){FR_CC[x]=1;});
var VOW='aeiouy';
function wordKnown(w){
  var f=foldW(w);
  if(FRFOLD[f])return true;
  var s=['s','x','e','es','ent','er','ez','ons','ee','ees','a','ait','ais','ant','ie','ment','e','ees','ent','ant'];
  for(var i=0;i<s.length;i++){
    if(f.length>s[i].length+2&&f.slice(-s[i].length)===s[i]&&FRFOLD[f.slice(0,-s[i].length)])return true;
  }
  if(f.length>5&&f.slice(-2)==='es'&&FRFOLD[f.slice(0,-2)+'er'])return true;
  if(f.length>4&&(f.slice(-1)==='e'||f.slice(-1)==='s')&&FRFOLD[f.slice(0,-1)+'er'])return true;
  if(f.length>4&&f.slice(-1)==='e'&&FRFOLD[f.slice(0,-1)+'r'])return true;
  return false;
}
function wordBad(w){
  var f=foldW(w).replace(/[^a-z]/g,'');
  if(!f)return false;
  if(f.length===1)return !/^[aày]$/.test(f);
  if(f.length>=3&&!/[aeiouy]/.test(f))return true;
  if(f.length>=17)return true;
  if(/(.)\1\1/.test(f))return true;                 // lll
  if(/[^aeiouy]{4,}/.test(f))return true;           // 4 consonnes d'affilée
  for(var i=0;i<f.length-1;i++){
    var a=f[i],b=f[i+1];
    if(VOW.indexOf(a)<0&&VOW.indexOf(b)<0&&!FR_CC[a+b])return true;
  }
  if(/[kwzxj]/.test(f)&&(f.match(/[kwzxj]/g).length>=2)&&!wordKnown(w))return true;
  if(/q(?!u)/.test(f))return true;
  /* trop de lettres rares, ou presque pas de voyelles */
  var v=(f.match(/[aeiouy]/g)||[]).length;
  if(f.length>=6&&v/f.length<0.25)return true;
  /* alternance de 2 lettres en boucle (akakak) */
  if(/^(?:([a-z])([a-z]))\1\2/.test(f)||/([a-z]{2})\1\1/.test(f))return true;
  return false;
}
function gibberish(c){
  var toks=c.split(/[^A-Za-zÀ-ÖØ-öø-ÿ'’0-9-]+/).filter(Boolean).map(function(t){return t.replace(/^['’-]+|['’-]+$/g,'');}).filter(Boolean);
  var words=[];
  toks.forEach(function(t){t.split(/['’]/).forEach(function(x){if(x)words.push(x);});});
  words=words.filter(function(w){return /[A-Za-zÀ-ÖØ-öø-ÿ]/.test(w);});
  if(words.length<5)return true;
  var known=0,bad=0,seen={},uniq=0;
  words.forEach(function(w){
    var k=w.toLowerCase();if(!seen[k]){seen[k]=1;uniq++;}
    if(wordKnown(w))known++;else if(wordBad(w))bad++;
  });
  if(uniq<4)return true;
  if(bad/words.length>0.2)return true;
  if(known/words.length<0.3)return true;
  /* le même mot en boucle */
  var top=0,cnt={};words.forEach(function(w){var k=w.toLowerCase();cnt[k]=(cnt[k]||0)+1;if(cnt[k]>top)top=cnt[k];});
  if(top/words.length>0.5)return true;
  return false;
}
function txtCheck(s){
  var c=cleanTxt(s), len=c.length;
  if(len<MINC)return {ok:false,len:len,msg:len+' / '+MINC};
  if(gibberish(c))return {ok:false,len:len,msg:len+' / '+MINC+' · écris une vraie phrase'};
  return {ok:true,len:len,msg:len+' / '+MINC+' ✓'};
}
function itemOk(p,id){return txtCheck(p.n[id]).ok&&txtCheck(p.a[id]).ok;}
function missingItems(p){return ALL.filter(function(it){return p.r[it.id]==='i'&&!itemOk(p,it.id);});}
function effVerdict(p){

}

function cTotal(o){var t=0,k;if(o)for(k in o)t+=o[k]||0;return t;}

function bump(id,k,d){
  var p=P(), key=id+'.'+k, per=S.period||'-';
  var o=p.c[key]||(p.c[key]={});
  if(d>0){
    o[per]=(o[per]||0)+1;

    var from=o[per]>0?per:null, q;
    if(!from)for(q in o){if(o[q]>0)from=q;}
    if(from)o[from]--;
  }
  Object.keys(o).forEach(function(q){if(!o[q])delete o[q];});

function fromDoc(d,id){

/* ---------- Excel : la fiche officielle EAD, remplie dans le modèle d'origine ---------- */
var XL_ROWS={A:[19,20,21,22],B:[26,27,28,29,30],C:[34,35,36,37,38,39,40,41],D:[45,46,47,48,49,50,51]};
var XL_COL={tb:'B',s:'C',m:'D',i:'E',nn:'F'};
function xmlEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
}
function xlSetCell(xml,ref,text,newStyle){
  var re=new RegExp('<c r="'+ref+'"([^>]*?)(?:/>|>[\\s\\S]*?</c>)');
  return xml.replace(re,function(m,attrs){
    attrs=attrs.replace(/\s+t="[^"]*"/,'');
    if(newStyle!=null)attrs=attrs.replace(/\ss="\d+"/,'')+' s="'+newStyle+'"';
    return '<c r="'+ref+'"'+attrs+' t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(text)+'</t></is></c>';
  });
}
function xlCellStyle(xml,ref){
  var m=new RegExp('<c r="'+ref+'"[^>]*? s="(\\d+)"').exec(xml);
  return m?parseInt(m[1],10):null;
}
/* copie d'un style de cellule avec retour à la ligne automatique, pour que les commentaires longs restent lisibles */
function xlWrapStyle(st,s,cache){
  if(cache[s]!==undefined)return cache[s];
  var m=/<cellXfs count="(\d+)">([\s\S]*?)<\/cellXfs>/.exec(st.xml);
  var list=m?(m[2].match(/<xf\b[^>]*?(?:\/>|>[\s\S]*?<\/xf>)/g)||[]):[];
  var xf=list[s];
  if(!xf){cache[s]=s;return s;}
  var open=/^<xf\b([^>]*?)(\/?)>/.exec(xf);
  var attrs=open[1].replace(/\sapplyAlignment="[^"]*"/,'')+' applyAlignment="1"';
  var inner=open[2]==='/'?'':xf.replace(/^<xf\b[^>]*?>/,'').replace(/<\/xf>$/,'');
  var al=/<alignment\b([^>]*?)\/>/.exec(inner);
  var aat=(al?al[1]:'').replace(/\swrapText="[^"]*"/,'').replace(/\svertical="[^"]*"/,'')+' wrapText="1" vertical="top"';
  inner='<alignment'+aat+'/>'+inner.replace(/<alignment\b[^>]*?\/>/,'');
  var idx=list.length;
  st.xml=st.xml.replace(/<cellXfs count="\d+">([\s\S]*?)<\/cellXfs>/,function(all,body){
    return '<cellXfs count="'+(idx+1)+'">'+body+'<xf'+attrs+'>'+inner+'</xf></cellXfs>';
  });
  cache[s]=idx;
  return idx;
}
function xlRowHeight(xml,row){
  var m=new RegExp('<row r="'+row+'"[^>]*? ht="([\\d.]+)"').exec(xml);
  return m?parseFloat(m[1]):15;
}
function xlSetRowHeight(xml,row,ht){
  return xml.replace(new RegExp('(<row r="'+row+'"[^>]*?) ht="[\\d.]+"'),'$1 ht="'+ht+'"');
}
function xlLines(text,per){
  var n=0;
  String(text).split('\n').forEach(function(l){n+=Math.max(1,Math.ceil(l.length/per));});
  return n;
}
function xlSpec(i,withNotes){
  var p=S.p[i], I=S.info, c={}, fit=[];
  function put(ref,v){if(v!==''&&v!=null)c[ref]=v;}
  put('B3',(I['arb'+(i+1)]||'').trim());
  put('I3',I.observateur||'');
  put('B5',frDate(I.date));
  put('I5',I.lieu||'');
  put('B7',I.arb1||'');
  put('I7',I.arb2||'');
  put('B9',I.eqA||'');
  put('I9',I.eqB||'');
  put('B12',I.cat||'');
  if(I.comp==='competition')c.H11='X';
  if(I.comp==='tournoi')c.H13='X';
  if(I.genre==='f')c.N11='X';
  if(I.genre==='m')c.N13='X';
  if(I.scoreA||I.scoreB)c.B14=(I.scoreA||'')+' - '+(I.scoreB||'');
  SECTIONS.forEach(function(s){
    s.items.forEach(function(it,k){
      var row=XL_ROWS[s.k][k], v=p.r[it.id];
      if(v)c[XL_COL[v]+row]='X';
      if(withNotes){
        var parts=[], cs=counterText(p,it.id);
        if(p.n[it.id])parts.push(p.n[it.id]);
        if(v==='i'&&p.a[it.id])parts.push('À améliorer : '+p.a[it.id]);
        if(cs)parts.push(cs);
        if(parts.length){
          var t=parts.join('\n');
          c['G'+row]=t;
          fit.push({rows:[row],text:t,per:95});
        }
      }
    });
  });
  if(p.bilan){
    var t1="Bilan, points positifs et commentaires éventuels : \n"+p.bilan;
    c.A54=t1;fit.push({rows:[54,55],text:t1,per:150});
  }
  if(p.pistes){
    var t2="Pistes de travail :  \n"+p.pistes;
    c.A56=t2;fit.push({rows:[56,57],text:t2,per:150});
  }
  c.C61=String(grisCount(p))+'  *';
  var ev=effVerdict(p);
  if(ev==='ok')c.H61='X  Validée';
  if(ev==='ko')c.H62='X  Non validée';
  return {cells:c,fit:fit};
}
function buildXlsx(i,withNotes){
  if(!window.JSZip)return Promise.reject({code:'nozip'});
  var b64=(document.getElementById('tpl').textContent||'').replace(/\s+/g,'');
  var spec=xlSpec(i,withNotes);
  return JSZip.loadAsync(b64,{base64:true}).then(function(zip){
    return Promise.all([zip.file('xl/worksheets/sheet1.xml').async('string'),zip.file('xl/styles.xml').async('string')]).then(function(r){
      var xml=r[0], st={xml:r[1]}, cache={};
      Object.keys(spec.cells).forEach(function(ref){
        var ns=null;
        if(/^G\d+$/.test(ref)){
          var s0=xlCellStyle(xml,ref);
          if(s0!=null)ns=xlWrapStyle(st,s0,cache);
        }
        xml=xlSetCell(xml,ref,spec.cells[ref],ns);
      });
      spec.fit.forEach(function(f){
        var each=(xlLines(f.text,f.per)*13+8)/f.rows.length;
        f.rows.forEach(function(row){
          if(each>xlRowHeight(xml,row))xml=xlSetRowHeight(xml,row,Math.min(409,Math.round(each*4)/4));
        });
      });
      zip.file('xl/worksheets/sheet1.xml',xml);
      zip.file('xl/styles.xml',st.xml);
      return zip.generateAsync({type:'uint8array',compression:'DEFLATE'});
    });
  });
}
function saveXlsx(i,withNotes,st){

  });
}

var OR_KEY=["sk-or-v1-fb2133c6cec2e24fa49f1fb3","8a5d121b2979eadc557a61dd0801f12c8e8b19e7"].join("");
var OR_URL="https://openrouter.ai/api/v1/chat/completions";
function cvResize(file,maxPx,quality){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width,hh=img.height;
      if(w>maxPx||hh>maxPx){var k=maxPx/Math.max(w,hh);w=Math.round(w*k);hh=Math.round(hh*k);}
      var c=document.createElement('canvas');c.width=w;c.height=hh;
      c.getContext('2d').drawImage(img,0,0,w,hh);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',quality).split(',')[1]);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej({code:'image_rejected'});};
    img.src=url;
  });
}
async function cvAttempt(content,extra,signal){
  var ctrl=new AbortController(), to=setTimeout(function(){ctrl.abort();},30000), onAbort=function(){ctrl.abort();};
  if(signal)signal.addEventListener('abort',onAbort);
  try{
    var body=Object.assign({messages:[{role:'user',content:content}],temperature:0},extra);
    var r=await fetch(OR_URL,{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+OR_KEY,'HTTP-Referer':location.origin,'X-Title':'Fiche EAD'},body:JSON.stringify(body)});
    var j=await r.json();
    if(j.error)return {err:'rate_limited'};
    var txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
    if(!txt)return {err:'empty_completion'};
    var m=txt.match(/\{[\s\S]*\}/);
    if(!m)return {err:'invalid_json'};
    try{return {d:JSON.parse(m[0])};}catch(e){return {err:'invalid_json'};}
  }catch(e){
    if(signal&&signal.aborted)return {err:'cancelled'};
    return {err:e&&e.name==='AbortError'?'timeout':'network'};
  }finally{clearTimeout(to);if(signal)signal.removeEventListener('abort',onAbort);}
}
var SAMPLE={json:async function(prompt,opts){
  opts=opts||{};
  var content=[], imgs=opts.images||[];
  for(var i=0;i<imgs.length;i++){
    content.push({type:'image_url',image_url:{url:'data:image/jpeg;base64,'+await cvResize(imgs[i],1280,0.7)}});
  }
  content.push({type:'text',text:prompt});
  var r=await cvAttempt(content,{models:["qwen/qwen3.8-27b:free","google/gemma-4-26b-a4b-it:free"]},opts.signal);
  if(!r.d&&r.err!=='cancelled')r=await cvAttempt(content,{model:"openrouter/free"},opts.signal);
  if(!r.d)throw {code:r.err||'invalid_json'};
  return r.d;
}};

var CV_KEYS=['observateur','arb1','arb2','eqA','eqB','date','lieu','cat','genre','comp'];
var CV_ERR={
  not_granted:"Tu n'as pas autorisé Claude à lire la convocation pour cette page.",
  sampling_disabled:"Claude n'est pas disponible sur ce compte.",

  cancelled:"Lecture arrêtée.",

function cvPrompt(txt){
  return [
    "Tu lis une convocation ou une désignation de basket (photo, capture d'écran ou texte). Tu en extrais les informations d'un match à observer.",
    "Réponds uniquement par un objet JSON avec exactement ces clés : observateur, arb1, arb2, eqA, eqB, date, lieu, cat, genre, comp.",
    "Chaque valeur est une chaîne, ou null si l'information n'est pas écrite dans le document. Ne devine jamais et n'invente rien.",
    "- observateur : nom de l'observateur ou évaluateur désigné, s'il figure dans le document.",
    "- arb1, arb2 : les deux arbitres de la rencontre, dans l'ordre du document. Écris chaque nom comme dans le document.",
    "- eqA, eqB : l'équipe recevante (eqA) puis l'équipe visiteuse (eqB), écrites comme dans le document.",
    "- date : au format AAAA-MM-JJ. Si l'année n'est pas écrite, prends celle de la saison en cours. La date du jour est "+today()+".",
    "- lieu : la salle ou le gymnase, avec la ville, comme écrit.",
    "- cat : la catégorie et la division ou le championnat (par exemple « U15 Départemental 1 »), sans répéter masculin ou féminin.",
    "- genre : \"m\" pour masculin (garçons, SM, U13M…), \"f\" pour féminin (filles, SF, U15F…).",
    "- comp : \"competition\" pour un match de championnat ou de coupe, \"tournoi\" pour un tournoi ou un plateau.",
    "S'il y a plusieurs rencontres dans le document, extrais seulement la première.",
    txt?("\nTexte de la convocation :\n"+txt):"\nLa convocation est dans l'image jointe."
  ].join('\n');

function cvClean(key,v){
  if(typeof v!=='string')return '';
  v=v.replace(/\s+/g,' ').trim();
  if(!v||/^(null|n\/a|inconnu|non précisé)$/i.test(v))return '';
  if(key==='date'){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    if(!m)return '';
    var d=new Date(+m[1],+m[2]-1,+m[3]);
    return (d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3])?v:'';
  }
  if(key==='genre')return v==='m'||v==='f'?v:'';
  if(key==='comp')return v==='competition'||v==='tournoi'?v:'';
  return v.slice(0,120);
}
function cvShow(key){

}
function cvApply(res){
  var prev={}, filled=[], missing=[];
  CV_KEYS.forEach(function(k){
    var v=cvClean(k,res&&res[k]);
    if(!v){missing.push(CV_LABEL[k]);return;}
    if((S.info[k]||'')!==v){prev[k]=S.info[k]||'';S.info[k]=v;cvShow(k);}
    filled.push(CV_LABEL[k]);
  });
  if(filled.length){CV.undo=prev;paint();save();}
  return {filled:filled,missing:missing,changed:Object.keys(prev).length};
}
function cvUndo(){
  if(!CV.undo)return;

/* écran allumé pendant le match */
var lock=null, lockPending=false;
function wake(){
  try{
    if(!navigator.wakeLock||lock||lockPending||document.visibilityState!=='visible')return;
    lockPending=true;
    navigator.wakeLock.request('screen').then(function(l){
      lock=l;lockPending=false;
      l.addEventListener('release',function(){lock=null;});
    },function(){lockPending=false;});
  }catch(e){lockPending=false;}
}
document.addEventListener('pointerdown',wake,{passive:true});
document.addEventListener('visibilitychange',wake);

/* sauvegarde immédiate quand la page se cache ou se ferme */
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush();});
window.addEventListener('pagehide',flush);

mount();
(function(){
  var b=document.getElementById('thb');if(!b)return;
  function cur(){var t=document.documentElement.getAttribute('data-theme');if(t)return t;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
  function paint(){b.textContent=cur()==='dark'?'☀':'☾';b.title=cur()==='dark'?'Passer en clair':'Passer en sombre';}
  b.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('fiche-theme',n);}catch(e){}paint();});
  paint();
})();

/* enregistrement sur le site : compte de l'observateur (Firebase), fiches lues et écrites par lui seul */
function cloudInit(){
  if(window.CloudFail||!window.Cloud){cloudFail=true;cloudState='off';paintSave();paintHistory();paintAccount();return;}
  Cloud=window.Cloud;
  Cloud.onAuth(function(u){
    if(unsub){unsub();unsub=null;}
    HIST=[];
    if(!u){USER=null;UID=null;cloudState='off';paintSave();paintHistory();paintAccount();return;}
    USER=u;UID=u.uid;cloudState='on';
    paintSave();paintAccount();paintHistory();
    unsub=Cloud.listen(UID,function(list){HIST=list;histErr='';paintHistory();},function(){histErr='1';paintHistory();});
    if(S.dirty&&hasContent())scheduleSync();
  });
}
if(window.Cloud||window.CloudFail)cloudInit();else window.addEventListener('cloud-ready',cloudInit);
})();
